# Review before applying. Only the admin applies this to the intended cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rizenvuln-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rizenvuln-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rizenvuln-reader
subjects:
  - kind: ServiceAccount
    name: rizenvuln-reader
    namespace: default
roleRef:
  kind: ClusterRole
  name: rizenvuln-reader
  apiGroup: rbac.authorization.k8s.io
