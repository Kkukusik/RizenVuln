сstages: [test, build]
rust:
  image: rust:1.100-bookworm
  stage: test
  before_script: [rustup component add rustfmt clippy]
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
frontend:
  image: node:22-bookworm-slim
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm run build
    - npm run test -- --run
scripts:
  image: python:3.13-slim
  stage: test
  script: [python3 -m unittest discover -s tests -p 'test_*.py']
postgres:
  image: rust:1.100-bookworm
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: rizenvuln_test
    POSTGRES_USER: rizenvuln
    POSTGRES_PASSWORD: ci-ephemeral-database-only
    TEST_DATABASE_URL: postgres://rizenvuln:ci-ephemeral-database-only@postgres/rizenvuln_test
  script: [cargo test -p rizenvuln-database -- --ignored]
compose:
  image: docker:cli
  stage: build
  script:
    - cp .env.example .env
    - POSTGRES_PASSWORD=ci-validation-only docker compose config -q
