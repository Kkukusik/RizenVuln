name: rizenvuln
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  env_file: ${RIZENVULN_ENV_FILE:-.env}
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging
  depends_on:
    rizenvuln-postgres:
      condition: service_healthy
  networks: [database, outbound]
  volumes:
    - ./config/certs:/app/certs:ro
services:
  rizenvuln-api:
    <<: *app
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/health/ready]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
  rizenvuln-worker:
    <<: *app
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      rizenvuln-postgres:
        condition: service_healthy
      rizenvuln-api:
        condition: service_healthy
    volumes:
      - trivy-cache:/var/cache/trivy
      - ./config/certs:/app/certs:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=4g,uid=10001,gid=10001"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "test -r /tmp/worker-ready && test $$(($$(date +%s) - $$(cat /tmp/worker-ready))) -lt 120"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  rizenvuln-postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rizenvuln}
      POSTGRES_USER: ${POSTGRES_USER:-rizenvuln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.sh first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes: [postgres-data:/var/lib/postgresql/data]
    tmpfs:
      - "/var/run/postgresql:rw,nosuid,size=16m,uid=70,gid=70"
      - "/tmp:rw,noexec,nosuid,size=64m"
    networks: [database]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  database:
    internal: true
  outbound: {}
volumes:
  postgres-data: {}
  trivy-cache: {}
